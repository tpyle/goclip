name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install Xvfb (Linux only, for real X11 backend coverage)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: go vet
        run: go vet ./...

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: go test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test -cover ./...

      - name: go test
        if: runner.os != 'Linux'
        run: go test -cover ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
